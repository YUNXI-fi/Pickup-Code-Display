# 部署用：直接拉取 CI 构建好的镜像，不需要 Dockerfile 和源码
# 本地开发需要自行构建时：
#   docker build -t ghcr.io/yunxi-fi/pickup-code-display:1.3.1 .
#   docker compose up -d
services:
  pickup-codes:
    image: ghcr.io/yunxi-fi/pickup-code-display:1.3.1
    container_name: pickup-codes
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_DURATION_HOURS: ${SESSION_DURATION_HOURS:-12}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Qwen/Qwen3.6-27B}
    volumes:
      # 数据库文件（data.db）持久化到宿主机 ./data
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
