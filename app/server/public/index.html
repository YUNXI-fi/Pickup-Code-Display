<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取件码展示</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#2563eb' } } } }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <a href="admin.html"><img src="favicon.svg" class="h-9 w-auto" alt="取件码展示"></a>
      <div class="flex items-center gap-3">
        <span id="countBadge" class="bg-primary text-white px-4 py-1.5 rounded-full text-sm font-medium">0</span>
        <a href="admin.html" class="text-sm font-medium text-gray-500 border border-gray-300 rounded-lg px-3 py-1.5 hover:border-primary hover:text-primary transition-colors">管理</a>
      </div>
    </div>

    <div id="statusBar" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-sm shadow-lg hidden transition-opacity duration-300"></div>

    <div class="flex flex-col gap-2 mb-6">
      <div class="flex rounded-lg overflow-hidden border border-gray-300 text-sm w-fit">
        <button id="groupAddress" class="px-4 py-1.5 bg-primary text-white font-medium transition-colors">取件地址</button>
        <button id="groupStatus" class="px-4 py-1.5 bg-white text-gray-600 transition-colors">取件情况</button>
      </div>
      <div class="flex rounded-lg overflow-hidden border border-gray-300 text-sm w-fit">
        <button id="filterAll" class="px-4 py-1.5 bg-primary text-white font-medium transition-colors">全部<span id="countAll" class="ml-1.5 opacity-70">0</span></button>
        <button id="filterPending" class="px-4 py-1.5 bg-white text-gray-600 transition-colors">待取件<span id="countPending" class="ml-1.5 opacity-70">0</span></button>
        <button id="filterPicked" class="px-4 py-1.5 bg-white text-gray-600 transition-colors">已取件<span id="countPicked" class="ml-1.5 opacity-70">0</span></button>
      </div>
    </div>

    <div id="list" class="space-y-6"></div>
    <div id="empty" class="text-center py-20 text-gray-400 hidden">
      <p class="text-6xl mb-4">📦</p>
      <p class="text-lg">暂无可取件包裹</p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
